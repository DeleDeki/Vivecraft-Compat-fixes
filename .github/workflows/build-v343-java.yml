name: Build Vivecraft Compat v3.4.3 from Java source
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/v343-asm/**'
      - 'v343-source.gradle'
      - 'build.gradle'
      - 'src/main/resources/vivecraftcompat.mixins.json'
      - '.github/workflows/build-v343-java.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Confirm Java-source reconstruction is committed
        run: |
          test -f src/v343-asm/classes.list || (echo "First extract and commit the Java source overlay ZIP." && exit 1)
          test -f src/v343-asm/java/V343ClassEmitter.java
      - name: Build mod and source JAR
        run: bash ./gradlew --no-daemon clean build
      - name: Check custom classes are present
        shell: bash
        run: |
          set -euo pipefail
          MODJAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*sources*.jar' | head -1)
          jar tf "$MODJAR" | grep -F 'com/tom/vivecraftcompat/simulated/SableVRBridge.class'
          jar tf "$MODJAR" | grep -F 'com/tom/vivecraftcompat/create/CreateSeatVRBridge.class'
          jar tf "$MODJAR" | grep -F 'com/tom/vivecraftcompat/simulated/SimulatedVRInputBridge.class'
          echo "Built: $MODJAR"
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vivecraft-compat-java-source-build
          path: build/libs/*.jar
          retention-days: 14
